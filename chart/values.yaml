# Everything the chart can be told. Only `image.repository` and `config.API_BASE_URL`
# normally need changing.

replicaCount: 2

image:
  repository: ghcr.io/your-org/json-store-web
  tag: ""              # required: the exact image this release runs, never a moving tag
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 8080

config:
  # Where the browser reaches the API. Leave empty when the Route or Ingress below
  # sends /api to the API service on this same host — then there is no CORS at all.
  API_BASE_URL: ""

  # What this deployment calls itself, applied before the first paint. Leave these empty to
  # keep the app's own name, mark and colour. Changing any of them rolls the pods, because
  # the Deployment carries a checksum of this ConfigMap.
  APP_NAME: ""          # e.g. "Acme Test Data"
  BRAND_MARK: ""        # one or two characters for the square mark, e.g. "A"
  ACCENT_COLOR: ""      # hex only, e.g. "#0b6bcb"; anything else is ignored

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# OpenShift Route. Use `ingress` instead on plain Kubernetes.
route:
  enabled: false
  host: ""
  tls:
    termination: edge

ingress:
  enabled: false
  className: nginx
  host: ""
  tls:
    enabled: true
    secretName: json-store-tls

nodeSelector: {}
tolerations: []
affinity: {}
