apiVersion: apps/v1
kind: Deployment
metadata:
  name: json-store-web
  labels:
    app: json-store-web
    app.kubernetes.io/name: json-store-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: json-store-web }
  template:
    metadata:
      labels: { app: json-store-web }
    spec:
      containers:
        - name: web
          image: image-registry.openshift-image-registry.svc:5000/json-store/json-store-web:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # Empty means same origin: the Route sends /api to the API service on this host.
            # Set it to the API's own URL if the two are on different hostnames.
            - { name: API_BASE_URL, value: '' }
            - { name: APP_VERSION, value: '1.0.0' }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          securityContext:
            # No runAsUser: OpenShift picks the UID. The image gives GID 0 write access to
            # the few paths nginx and the entrypoint need.
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
            seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: json-store-web
  labels: { app: json-store-web }
spec:
  selector: { app: json-store-web }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: json-store-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: json-store-web }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
