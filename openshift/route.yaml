# One hostname, two Routes: static files from here, /api from the API deployment.
# Same origin means no CORS preflights, one certificate, and no cross-origin latency.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: json-store-web
spec:
  host: json-store.apps.example.com
  path: /
  to:
    kind: Service
    name: json-store-web
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Needs the Service from the json-store-api repository to exist in this namespace.
# Longest path wins in the OpenShift router, so /api is matched before /.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: json-store-api-path
spec:
  host: json-store.apps.example.com
  path: /api
  to:
    kind: Service
    name: json-store-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
