name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: azure/setup-helm@v4
      # The chart refuses to render without an image tag, so lint supplies a stand-in.
      - run: helm lint chart --set image.tag=ci
      - run: docker build -t json-store-web:${{ github.sha }} .
